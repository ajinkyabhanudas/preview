<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="bt bd">
  <title id="bt">Preview</title>
  <desc id="bd">Evidence for product work that has no market. A rising ladder of six tiers, E0 to E5. The first four are reachable without users; E3 is the highest of these and is filled solid. E4 and E5 require a market and are drawn as empty outlines.</desc>

  <defs>
    <linearGradient id="e3fill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" class="g0"/>
      <stop offset="1" class="g1"/>
    </linearGradient>
  </defs>

  <style>
    .bg    { fill: #fbfbfc; }
    .name  { fill: #0d1117; }
    .sub   { fill: #4a5260; }
    .step  { fill: #dfe3e9; }
    .stepl { fill: #6b7280; }
    .g0    { stop-color: #1f6feb; }
    .g1    { stop-color: #4c8dff; }
    .e3t   { fill: #ffffff; }
    .locked{ fill: none; stroke: #cdd3dc; stroke-width: 2; stroke-dasharray: 5 5; }
    .lockl { fill: #9aa3b0; }
    .rule  { stroke: #e6e9ee; }
    .kicker{ fill: #1f6feb; }
    .foot  { fill: #4a5260; }

    /* GitHub serves light or dark. A banner that works in only one of them
       looks broken half the time. */
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0b0d11; }
      .name  { fill: #f0f2f6; }
      .sub   { fill: #9aa3b0; }
      .step  { fill: #1c222b; }
      .stepl { fill: #7d8590; }
      .g0    { stop-color: #2f6fd0; }
      .g1    { stop-color: #6ba5ff; }
      .e3t   { fill: #06090d; }
      /* fill must be restated, not inherited: an override that only changes
         stroke leaves these solid in some renderers, which inverts the whole
         point — the unreachable tiers would read as the most emphasised. */
      .locked{ fill: none; stroke: #39424f; stroke-width: 2; stroke-dasharray: 5 5; }
      .lockl { fill: #5c6470; }
      .rule  { stroke: #1c222b; }
      .kicker{ fill: #6ba5ff; }
      .foot  { fill: #9aa3b0; }
    }
  </style>

  <rect class="bg" width="1200" height="400"/>

  <!-- Wordmark occupies the left half; the ladder takes the right. -->
  <text class="kicker" x="72" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="13" font-weight="bold" letter-spacing="2.4">THE EVIDENCE LADDER</text>

  <text class="name" x="70" y="176" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="76" font-weight="bold" letter-spacing="-2.6">Preview</text>

  <text class="sub" x="72" y="222" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="21" letter-spacing="-0.3">Evidence for product work that has no market.</text>

  <line class="rule" x1="72" y1="266" x2="470" y2="266" stroke-width="1"/>

  <text class="foot" x="72" y="300" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17">
    <tspan font-weight="bold">E3 needs no users</tspan><tspan> — and is harder</tspan>
  </text>
  <text class="foot" x="72" y="326" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17">to fake than the tiers above it.</text>

  <!-- The ladder. Height encodes tier, so the shape reads before any label
       does: it climbs, then stops being solid. The empty outlines where E4 and
       E5 should be filled are the argument, not decoration around it. -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="bold">
    <rect class="step" x="560" y="300" width="82" height="40" rx="4"/>
    <text class="stepl" x="601" y="326" text-anchor="middle">E0</text>

    <rect class="step" x="654" y="266" width="82" height="74" rx="4"/>
    <text class="stepl" x="695" y="326" text-anchor="middle">E1</text>

    <rect class="step" x="748" y="220" width="82" height="120" rx="4"/>
    <text class="stepl" x="789" y="326" text-anchor="middle">E2</text>

    <!-- E3 — the peak of what is reachable without a market. The only step
         that is saturated and the only one carrying a descriptor. -->
    <rect x="842" y="140" width="82" height="200" rx="4" fill="url(#e3fill)"/>
    <text class="e3t" x="883" y="326" text-anchor="middle" font-weight="bold">E3</text>
    <text class="e3t" x="883" y="172" text-anchor="middle" font-size="11" font-weight="bold" letter-spacing="0.6" opacity="0.95">FROZEN</text>
    <text class="e3t" x="883" y="188" text-anchor="middle" font-size="11" font-weight="bold" letter-spacing="0.6" opacity="0.95">EVAL</text>

    <rect class="locked" fill="none" x="936" y="104" width="82" height="236" rx="4"/>
    <text class="lockl" x="977" y="326" text-anchor="middle">E4</text>

    <rect class="locked" fill="none" x="1030" y="68" width="82" height="272" rx="4"/>
    <text class="lockl" x="1071" y="326" text-anchor="middle">E5</text>
  </g>

  <line class="rule" x1="560" y1="341" x2="1112" y2="341" stroke-width="1.5"/>

  <text class="stepl" x="560" y="368" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">no users needed</text>
  <text class="lockl" x="1112" y="368" text-anchor="end" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">needs a market</text>
</svg>
